version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Odd Node majors never become LTS
      - dependency-name: node
        versions: ["23.x", "25.x", "27.x", "29.x", "31.x"]
